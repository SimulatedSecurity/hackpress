name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload assets for
        required: true
        type: string
        default: v0.2.0

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-upload:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: hackpress-windows-x86_64.exe
            bin: hackpress.exe
          - os: ubuntu-24.04-arm
            artifact: hackpress-linux-arm64
            bin: hackpress
          - os: macos-latest
            artifact: hackpress-macos-arm64
            bin: hackpress

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          src="target/release/${{ matrix.bin }}"
          cp "$src" "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}" || true
          ls -lh "dist/${{ matrix.artifact }}"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          gh release upload "$TAG" "dist/${{ matrix.artifact }}" --clobber
